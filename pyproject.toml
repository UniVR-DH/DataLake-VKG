[project]
name = "dremio-setup"
version = "0.1.0"
description = "Automated Dremio source setup for the tourism knowledge graph"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "numpy>=2.4.6",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "jinja2>=3.1.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "boto3>=1.35",
    "python-multipart>=0.0.9",
    "croissant-baker",
    "docker>=7.0"
]
