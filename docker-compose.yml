services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datalake-vkg-api
    env_file:
      - .env
    environment:
      ONTOP_INPUT_DIR: /app/datalake_vkg_api/tools/ontop/input
    ports:
      - "${API_PORT:-5002}:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./systems/ontop/input:/app/datalake_vkg_api/tools/ontop/input
      - credentials:/credentials:ro
    depends_on:
      dremio_init:
        condition: service_completed_successfully
      garage_init:
        condition: service_completed_successfully
      ontop:
        condition: service_started
    restart: unless-stopped
    networks:
      - ontop-network

  ontop:
    image: ontop/ontop:latest
    container_name: ontop-endpoint
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./systems/ontop/input:/opt/ontop/input
      - ./datalake-vkg-api/tools/jdbc:/opt/ontop/jdbc:ro
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/ontology.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/mapping.ttl
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/ontop.properties
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_DEV_MODE: "true"
      JAVA_TOOL_OPTIONS: "--add-opens=java.base/java.nio=ALL-UNNAMED"
    env_file:
      - .env
    depends_on:
      dremio:
        condition: service_healthy
      dremio_init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ontop-network


  garage:
    image: dxflrs/garage:b72b090a097c8ee2711c8fb065d250ed68dcd0bf
    container_name: garage
    env_file: .env
    restart: unless-stopped
    command: ["/garage", "-c", "/garageconfig/garage.toml", "server"]
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - garage_config:/garageconfig:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/garageconfig/garage.toml", "node", "id"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      garage_config:
        condition: service_completed_successfully
    networks:
      - ontop-network

  garage_config:
    image: alpine:3
    container_name: garage-config
    restart: "no"
    environment:
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET}"
      GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN}"
    command: ["sh", "/scripts/generate-config.sh"]
    volumes:
      - ./systems/garage/generate-config.sh:/scripts/generate-config.sh:ro
      - ./systems/garage/garage.toml:/template/garage.toml:ro
      - garage_config:/config
    networks:
      - ontop-network

  dremio:
    image: dremio/dremio-oss:latest
    container_name: dremio
    env_file:
      - .env
    ports:
      - "${DREMIO_PORT:-9047}:9047"
      - "${DREMIO_FLIGHT_PORT:-32010}:32010"
    volumes:
      - dremio_data:/var/lib/dremio
      - ./systems/ontop/input/data:/var/data/csv:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9047 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 300s
    networks:
      - ontop-network

  garage_init:
    image: alpine:3
    container_name: garage-init
    pid: service:garage
    command: ["sh", "/scripts/garage-init.sh"]
    environment:
      GARAGE_BUCKET: "${GARAGE_CSV_BUCKET:-csvdata}"
    volumes:
      - ./systems/garage/garage-init.sh:/scripts/garage-init.sh:ro
      - credentials:/credentials
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"
    networks:
      - ontop-network

  dremio_init:
    image: python:3.11-slim
    container_name: dremio-init
    working_dir: /workspace/datalake-vkg-api/tools
    command: ["sh", "/workspace/datalake-vkg-api/tools/scripts/dremio-init.sh"]
    env_file:
      - .env
    environment:
      DREMIO_HOST: dremio
    volumes:
      - ./:/workspace
    depends_on:
      dremio:
        condition: service_healthy
    restart: "no"
    networks:
      - ontop-network

volumes:
  dremio_data:
  garage_meta:
  garage_data:
  garage_config:
  credentials:

networks:
  ontop-network:
    driver: bridge
