services:
  garage-init:
    image: alpine:3.19
    container_name: garage-init
    depends_on:
      - garage
    network_mode: service:garage
    pid: service:garage
    env_file: .env
    volumes:
      - garage_credentials:/credentials
      - ./scripts/garage-init.sh:/scripts/garage-init.sh:ro
    restart: "on-failure:5"
    entrypoint: ["/bin/sh", "/scripts/garage-init.sh"]

  csv-uploader:
    &uploader
    image: amazon/aws-cli:latest
    container_name: csv-uploader
    depends_on:
      garage-init:
        condition: service_completed_successfully
    env_file: .env
    volumes:
      - ./input/data/tourism/csv:/data/tourism:ro
      - ./input/data/arpav/csv:/data/arpav:ro
      - garage_credentials:/credentials:ro
      - ./scripts/uploader.sh:/scripts/uploader.sh:ro
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    entrypoint: ["/bin/sh", "/scripts/uploader.sh"]
    command: ["csv"]
    restart: "no"
    networks:
      - ontop-network

  parquet-uploader:
    <<: *uploader
    container_name: parquet-uploader
    volumes:
      - ./input/data/tourism/parquet:/data/tourism/parquet:ro
      - ./input/data/arpav/parquet:/data/arpav/parquet:ro
      - garage_credentials:/credentials:ro
      - ./scripts/uploader.sh:/scripts/uploader.sh:ro
    command: ["parquet"]

  dremio-init:
    image: python:3.12-slim
    container_name: dremio-init
    env_file: .env
    volumes:
      - ./scripts/dremio-setup.py:/app/scripts/dremio-setup.py:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - garage_credentials:/credentials:ro
      - ./scripts/dremio-init.sh:/app/dremio-init.sh:ro
    working_dir: /app
    environment:
      DREMIO_HOST: dremio
    command: ["/bin/sh", "/app/dremio-init.sh"]
    restart: "no"
    depends_on:
      dremio:
        condition: service_healthy
      csv-uploader:
        condition: service_completed_successfully
      parquet-uploader:
        condition: service_completed_successfully
    networks:
      - ontop-network